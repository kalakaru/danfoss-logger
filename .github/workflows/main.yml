name: Danfoss Data Logger

on:
  schedule:
    # Führt das Skript alle 30 Minuten aus
    - cron: '*/30 * * * *'
  workflow_dispatch: # Erlaubt dir, das Skript auch manuell per Button zu starten

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: R installieren
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Nötige R-Pakete installieren
        run: |
          Rscript -e 'install.packages(c("httr", "jsonlite", "dplyr", "tidyr", "lubridate"))'

      - name: Skript ausführen und Daten holen
        env:
          # Hier werden die Secrets sicher an das R-Skript übergeben
          DANFOSS_CLIENT_ID: ${{ secrets.DANFOSS_CLIENT_ID }}
          DANFOSS_CLIENT_SECRET: ${{ secrets.DANFOSS_CLIENT_SECRET }}
        run: Rscript danfoss_logger.R

      - name: CSV committen und pushen
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add danfoss_zeitverlauf.csv
          # Der Befehl bricht nicht ab, falls sich mal nichts geändert hat
          git commit -m "Automatisches Daten-Update" || echo "Keine neuen Daten"
          git push
